<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Slay the Dragon!</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');

    :root {
      --easy: #4ade80;
      --medium: #facc15;
      --hard: #f87171;
      --aoe: #1c6380;
      --hp-bg: #4b1307;
      --hp-fill: #f97316;
      --hp-fill-defeated: #22c55e;
    }

    body {
      margin: 0;
      padding: 2rem;
      justify-content: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #111;
      background-color: #b8a885; /* fallback beige color */
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      background-repeat: repeat;
      background-size: auto;
      font-family: 'MedievalSharp', cursive;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
      text-align: center;
    }

    h2 {
      margin-top: 2rem;
      font-size: 1.2rem;
    }

    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      margin-top: .5rem;
      margin-bottom: 1.5rem;
    }

    th, td {
      text-align: left;
      padding: .4rem 0;
      font-size: .95rem;
      border-bottom: 1px solid #eee;
    }

    td:last-child {
      text-align: right;
      font-weight: 600;
    }

    /* difficulty color accents */
    .easy td:last-child { color: var(--easy); }
    .medium td:last-child { color: var(--medium); }
    .hard td:last-child { color: var(--hard); }
    .aoe td:last-child { color: var(--aoe); }

    .content {
      width: 100%;
      max-width: 700px;
    }

    /* DRAGON HP BAR */
    .dragon-hp {
      margin: 1rem 0 1.5rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 2px solid #3b2f2f;
      background: #f8f0d6;
      transition: transform 0.1s ease-out;
    }

    .dragon-hp-title {
      font-size: 1rem;
      margin: 0 0 0.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #hp-text {
      font-size: 0.9rem;
    }

    .hp-bar {
      position: relative;
      width: 100%;
      height: 18px;
      border-radius: 999px;
      background: var(--hp-bg);
      overflow: hidden;
      margin-top: 0.25rem;
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      background: var(--hp-fill);
      transition: width 0.25s ease-out, background-color 0.15s ease-out, box-shadow 0.15s ease-out;
      box-shadow: none;
    }

    .hp-bar-inner.defeated {
      background: var(--hp-fill-defeated);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }

    #reset-dragon {
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #3b2f2f;
      background: #fff4d4;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    #reset-dragon:hover {
      background: #f1e4c0;
    }

    /* Shake animation on defeat */
    .dragon-hp.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    /* roll button */
    #roll-btn {
      margin: 1rem auto 0;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 999px;
      border: 2px solid #333;
      background: #f8f0d6;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    #roll-btn:hover {
      background: #f1e4c0;
    }

    .hidden {
      display: none;
    }

    /* modal / popup */
    #quest-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* ensure hidden actually hides it */
    #quest-modal.hidden {
      display: none;
    }

    .modal-inner {
      background: #f8f0d6;
      border: 2px solid #3b2f2f;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .modal-inner h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }

    .modal-inner p {
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .modal-actions button {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid #3b2f2f;
      background: #fff4d4;
      cursor: pointer;
      font-family: 'MedievalSharp', cursive;
    }

    .modal-actions button:hover {
      background: #f1e4c0;
    }

    .badge {
      display: inline-block;
      margin-bottom: 0.5rem;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid #3b2f2f;
    }

    .badge.easy { border-color: var(--easy); color: var(--easy); }
    .badge.medium { border-color: var(--medium); color: var(--medium); }
    .badge.hard { border-color: var(--hard); color: var(--hard); }
    .badge.aoe { border-color: var(--aoe); color: var(--aoe); }
  </style>
</head>
<body>
  <div class="content">
    <h1>Slay the Dragon!</h1>

    <!-- DRAGON HP SECTION -->
    <div class="dragon-hp" id="dragon-hp-box">
      <div class="dragon-hp-title">
        <span>🐉 Dragon HP</span>
        <span id="hp-text">Dragon HP: 0 / 0</span>
      </div>
      <div class="hp-bar">
        <div class="hp-bar-inner" id="hp-fill"></div>
      </div>
      <button id="reset-dragon">Summon new dragon</button>
    </div>

    <!-- Dice roll button -->
    <button id="roll-btn">🎲 Roll the dice for a quest</button>

    <!-- Tables -->
    <h2>Everyday Quests (Easy)</h2>
    <table id="easy"></table>

    <h2>Heroic Housekeeping (Medium)</h2>
    <table id="medium"></table>

    <h2>Dragon-Slaying Duties (Hard)</h2>
    <table id="hard"></table>

    <h2>Area of Effect Spells (Critical)</h2>
    <table id="aoe"></table>
  </div>

  <!-- Quest popup modal -->
  <div id="quest-modal" class="hidden">
    <div class="modal-inner">
      <h3 id="quest-title">New quest!</h3>
      <div id="quest-badge"></div>
      <p id="quest-text"></p>
      <p id="quest-damage"></p>

      <div class="modal-actions">
        <button id="btn-accept">Accept quest</button>
        <button id="btn-reroll">Roll again</button>
        <button id="btn-done" class="hidden">Mark as done</button>
        <button id="btn-cancel" class="hidden">Cancel quest</button>
      </div>
    </div>
  </div>

  <script>
    const tasks = {
      easy: [
        ["Make your bed", "10"],
        ["Put dishes into the dishwasher or sink", "10"],
        ["Wipe down your desk", "10"],
        ["Take trash out", "10"],
        ["Drink a glass of water", "10"],
        ["Sort 3–5 items into their place", "10"],
        ["Put on a load of laundry", "15"],
        ["Take care of the plants", "10"],
        ["Take care of the pets", "10"],
        ["Take a short walk for fresh air", "15"]
      ],
      medium: [
        ["Kitchen counters", "20"],
        ["Do the dishes", "30"],
        ["Bathroom counters", "20"],
        ["Change bedsheets", "25"],
        ["Put laundry away", "25"],
        ["Cook a meal", "20"],
        ["Clear your desk", "20"],
        ["Scrub the toilet", "25"],
        ["Scrub the shower", "30"],
        ["Reorganize a drawer", "25"]
      ],
      hard: [
        ["Grocery shop + unpack", "35"],
        ["Clean kitchen (surfaces + dishes + stove)", "40"],
        ["Clean the fridge", "40"],
        ["Toss expired food (fridge and/or pantry)", "30"],
        ["Clean the oven", "40"],
        ["Clean the recycling bins", "30"],
        ["Deep-clean bathroom", "45"],
        ["Clean the windows (in one room)", "35"]
      ],
      aoe: [
        ["Wipe all surfaces", "25"],
        ["Open the windows for 20 minutes", "20"],
        ["Mop the floors", "45"],
        ["Vacuum the floors", "40"],
        ["Time Trial! (10 min speed clean)", "30"],
        ["Declutter an area", "35"],
        ["Choose your task!", "30"]
      ]
    };

    // DRAGON HP LOGIC
    const maxHP = 300; // dragon HP here
    let currentHP = maxHP;

    const hpFill = document.getElementById("hp-fill");
    const hpText = document.getElementById("hp-text");
    const resetDragonBtn = document.getElementById("reset-dragon");
    const dragonHpBox = document.getElementById("dragon-hp-box");

    function updateHPUI() {
      const percent = Math.max(0, (currentHP / maxHP) * 100);
      hpFill.style.width = percent + "%";

      if (currentHP <= 0) {
        hpFill.classList.add("defeated");
        hpText.textContent = "Dragon slain! 🎉";

        // Trigger shake animation
        dragonHpBox.classList.add("shake");
        setTimeout(() => {
          dragonHpBox.classList.remove("shake");
        }, 400);
      } else {
        hpFill.classList.remove("defeated");
        hpText.textContent = `Dragon HP: ${currentHP} / ${maxHP}`;
      }
    }

    function resetDragon() {
      currentHP = maxHP;
      updateHPUI();
    }

    resetDragonBtn.addEventListener("click", resetDragon);

    // Shuffle helper
    function shuffle(array) {
      let currentIndex = array.length;
      while (currentIndex !== 0) {
        const randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [
          array[randomIndex],
          array[currentIndex]
        ];
      }
      return array;
    }

    // Populate with up to 5 random tasks
    for (const diff in tasks) {
      const table = document.getElementById(diff);
      if (!table) continue;

      const randomized = shuffle([...tasks[diff]]);
      const visibleTasks = randomized.slice(0, 5);

      table.innerHTML = visibleTasks
        .map(([task, dmg]) =>
          `<tr class="${diff}">
            <td>${task}</td>
            <td>${dmg} HP</td>
          </tr>`
        )
        .join("");
    }

    // Flatten tasks randomizer
    const allTasks = Object.entries(tasks).flatMap(([difficulty, list]) =>
      list.map(([task, dmg]) => ({ difficulty, task, dmg }))
    );

    function getRandomTask() {
      const index = Math.floor(Math.random() * allTasks.length);
      return allTasks[index];
    }

    // Modal elements
    const modal = document.getElementById("quest-modal");
    const questTitle = document.getElementById("quest-title");
    const questText = document.getElementById("quest-text");
    const questDamage = document.getElementById("quest-damage");
    const questBadge = document.getElementById("quest-badge");

    const btnRoll = document.getElementById("roll-btn");
    const btnAccept = document.getElementById("btn-accept");
    const btnReroll = document.getElementById("btn-reroll");
    const btnDone = document.getElementById("btn-done");
    const btnCancel = document.getElementById("btn-cancel");

    let currentQuest = null;
    let questAccepted = false;

    function showButtonsInitial() {
      btnAccept.classList.remove("hidden");
      btnReroll.classList.remove("hidden");
      btnDone.classList.add("hidden");
      btnCancel.classList.add("hidden");
    }

    function showButtonsAccepted() {
      btnAccept.classList.add("hidden");
      btnReroll.classList.add("hidden");
      btnDone.classList.remove("hidden");
      btnCancel.classList.remove("hidden");
    }

    function openModal() {
      if (!currentQuest) return;
      modal.classList.remove("hidden");
    }

    function closeModal() {
      modal.classList.add("hidden");
    }

    function renderQuest(taskObj, mode = "offer") {
      const { difficulty, task, dmg } = taskObj;

      questBadge.innerHTML = `<span class="badge ${difficulty}">${difficulty === "aoe" ? "CRITICAL" : difficulty.toUpperCase()}</span>`;

      if (mode === "offer") {
        questTitle.textContent = "New quest!";
        questText.textContent = `You rolled: "${task}".`;
        questDamage.textContent = `Reward: ${dmg} HP damage to the dragon.`;
        showButtonsInitial();
      } else if (mode === "accepted") {
        questTitle.textContent = "Quest accepted!";
        questText.textContent = `You start your quest: "${task}".`;
        questDamage.textContent = `Complete it to deal ${dmg} HP damage.`;
        showButtonsAccepted();
      }
    }

    function rollNewQuest() {
      currentQuest = getRandomTask();
      questAccepted = false;
      renderQuest(currentQuest, "offer");
      openModal();
    }

    // Button events
    btnRoll.addEventListener("click", () => {
      rollNewQuest();
    });

    btnReroll.addEventListener("click", () => {
      rollNewQuest();
    });

    btnAccept.addEventListener("click", () => {
      if (!currentQuest) return;
      questAccepted = true;
      renderQuest(currentQuest, "accepted");
    });

    btnDone.addEventListener("click", () => {
      if (!currentQuest) return;

      // Apply damage to the dragon!
      const dmg = parseInt(currentQuest.dmg, 10);
      if (!isNaN(dmg) && currentHP > 0) {
        currentHP = Math.max(0, currentHP - dmg);
        updateHPUI();
      }

      closeModal();
      currentQuest = null;
      questAccepted = false;
    });

    btnCancel.addEventListener("click", () => {
      // cancel current quest -> immediately roll a new one
      rollNewQuest();
    });

    // Outside click closes modal only if quest NOT accepted
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        if (!questAccepted) {
          closeModal();
          currentQuest = null;
        }
      }
    });

    // Initialize HP UI on load
    updateHPUI();
  </script>
</body>
</html>
