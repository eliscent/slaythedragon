<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Slay the Dragon!</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');

body {
    margin: 0;
    padding: 2rem;
    justify-content: center;
    display: flex;
    color: #111;
    background-color: #b8a885; /* fallback beige color */
    background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
    background-repeat: repeat;
    background-size: auto;
    font-family: 'MedievalSharp', cursive;
}
#comingsoon {
    font-size: 2.5rem;
    color: #3b2f2f;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    text-align: center;
}
:root {
    --easy: #4ade80;
    --medium: #facc15;
    --hard: #f87171;
}

h2 {
    margin-top: 2rem;
    font-size: 1.2rem;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: .5rem;
    margin-bottom: 1.5rem;
}

th, td {
    text-align: left;
    padding: .4rem 0;
    font-size: .95rem;
    border-bottom: 1px solid #eee;
}

td:last-child {
    text-align: right;
    font-weight: 600;
}

/* difficulty color accents */
.easy td:last-child { color: var(--easy); }
.medium td:last-child { color: var(--medium); }
.hard td:last-child { color: var(--hard); }

</style>
</head>
<h2>Everyday Quests (Easy)</h2>
<table id="easy"></table>

<h2>Heroic Housekeeping (Medium)</h2>
<table id="medium"></table>

<h2>Dragon-Slaying Duties (Hard)</h2>
<table id="hard"></table>

<script>
const tasks = {
  easy: [
    ["Make your bed", "10"],
    ["Put dishes into the dishwasher or sink", "10"],
    ["Wipe down your desk", "10"],
    ["Take trash out", "10"],
    ["Drink a glass of water", "10"],
    ["Sort 3–5 items into place", "10"],
    ["Start a load of laundry", "15"],
    ["Water plants / care for pets", "10"]
  ],
  medium: [
    ["Kitchen counters", "20"],
    ["Do the dishes", "30"],
    ["Bathroom counters", "20"],
    ["Change bedsheets", "20"],
    ["Put laundry away", "30"],
    ["Cook a meal", "20"],
    ["Clear your desk", "20"],
    ["Short walk for fresh air", "20"],
    ["Scrub toilet", "20"],
    ["Scrub shower", "20"],
    ["Wipe surfaces", "20"]
  ],
  hard: [
    ["Mop a whole room or more", "40"],
    ["Vacuum a whole room or more", "40"],
    ["Deep-clean bathroom", "50"],
    ["Grocery shop + unpack", "30"],
    ["Declutter an area", "40"],
    ["Clean kitchen fully", "40"],
    ["Clean the fridge", "40"],
    ["45 minutes focused work", "30"],
    ["Choose your task! (Wildcard)", "30"]
  ]
};

// Simple shuffle function (Fisher-Yates)
function shuffle(array) {
  let currentIndex = array.length;
  while (currentIndex !== 0) {
    const randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex],
      array[currentIndex]
    ];
  }
  return array;
}

// Populate each table with random 5 tasks
for (const diff in tasks) {
  const table = document.getElementById(diff);

  const randomized = shuffle([...tasks[diff]]); // 👈 copy so original isn't changed
  const visibleTasks = randomized.slice(0, 5);  // 👈 pick 5 random ones

  table.innerHTML = visibleTasks
    .map(([task, dmg]) =>
      `<tr class="${diff}">
        <td>${task}</td>
        <td>${dmg} HP</td>
      </tr>`
    )
    .join("");
}

</script>

</body>
</html>
